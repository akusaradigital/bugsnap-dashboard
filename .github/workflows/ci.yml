name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Lint, Test, Build, Browser Smoke & Lighthouse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://kkmvanwgywrqsudvspge.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy"
          SUPABASE_SERVICE_ROLE_KEY: "dummy"
          GOOGLE_DRIVE_CLIENT_ID: "dummy"
          GOOGLE_DRIVE_CLIENT_SECRET: "dummy"
          GOOGLE_DRIVE_REDIRECT_URI: "http://localhost:3000/api/google-drive/callback"
          GOOGLE_DRIVE_ENCRYPTION_KEY: "12345678901234567890123456789012"

      - name: Start App
        run: |
          npm start &
          npx wait-on http://127.0.0.1:3000/api/health --timeout 60000
        env:
          PORT: 3000

      - name: E2E Smoke Test
        run: node tests/smoke.e2e.mjs
        env:
          BASE_URL: http://127.0.0.1:3000

      - name: Playwright Smoke Test
        run: npx playwright test
        env:
          BASE_URL: http://127.0.0.1:3000

      - name: Lighthouse CI Summary
        run: node scripts/lighthouse-ci.mjs

      - name: Auto-tag Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            echo "Creating and pushing tag $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
