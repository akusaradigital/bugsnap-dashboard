<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="qa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="qa-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89bd49" />
      <stop offset="100%" stop-color="#6b9a35" />
    </linearGradient>
    <filter id="qa-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="url(#qa-bg)" stroke="#334155" stroke-width="1.5" filter="url(#qa-shadow)" />

  <!-- Top Header (Matching Google Drive standard) -->
  <rect x="20" y="20" width="760" height="54" rx="16" fill="#1e293b" />
  <rect x="20" y="54" width="760" height="20" fill="#1e293b" />
  <line x1="20" y1="74" x2="780" y2="74" stroke="#334155" stroke-width="1" />

  <!-- Title Badge with QA Bug Icon -->
  <g transform="translate(40, 36)">
    <!-- Bug Target Icon -->
    <rect x="0" y="0" width="28" height="28" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1" />
    <circle cx="14" cy="14" r="6" stroke="#60a5fa" stroke-width="1.5" fill="none" />
    <circle cx="14" cy="14" r="2" fill="#60a5fa" />
    <line x1="14" y1="4" x2="14" y2="8" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" />
    <line x1="14" y1="20" x2="14" y2="24" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" />
    <line x1="4" y1="14" x2="8" y2="14" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" />
    <line x1="20" y1="14" x2="24" y2="14" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" />

    <text x="38" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">QA Studio</text>
    <text x="114" y="20" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">/</text>
    <text x="126" y="20" fill="#89bd49" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Visual Step Recorder</text>
  </g>

  <!-- Live QA Status Badge -->
  <g transform="translate(620, 38)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#ef4444" />
    <text x="24" y="16" fill="#f87171" font-family="monospace" font-size="11" font-weight="700">REC 00:28</text>
  </g>

  <!-- Left: Target Web App with QA Annotations -->
  <g transform="translate(40, 96)">
    <rect x="0" y="0" width="460" height="360" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />

    <!-- App Bar -->
    <rect x="0" y="0" width="460" height="30" rx="10" fill="#1e293b" />
    <rect x="0" y="18" width="460" height="12" fill="#1e293b" />
    <circle cx="14" cy="15" r="3" fill="#ef4444" />
    <circle cx="24" cy="15" r="3" fill="#f59e0b" />
    <circle cx="34" cy="15" r="3" fill="#10b981" />
    <rect x="50" y="8" width="220" height="14" rx="3" fill="#0f172a" />
    <text x="58" y="18" fill="#94a3b8" font-family="monospace" font-size="9">qa.staging.acme.corp/checkout</text>

    <!-- App Content: Shopping Cart &amp; Checkout Steps -->
    <g transform="translate(24, 46)">
      <text x="0" y="16" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Order Summary</text>

      <!-- Step 1 Pin: Promo Code Field -->
      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="280" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="12" y="22" fill="#94a3b8" font-family="monospace" font-size="11">DISCOUNT50_SUMMER</text>
        <rect x="200" y="5" width="70" height="26" rx="4" fill="#334155" />
        <text x="214" y="22" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Apply</text>

        <!-- Step 1 Pin Circle -->
        <circle cx="-10" cy="18" r="10" fill="#89bd49" />
        <text x="-13" y="22" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="800">1</text>
      </g>

      <!-- Step 2 Pin: Broken Promo Code Error Message -->
      <g transform="translate(0, 80)">
        <rect x="0" y="0" width="380" height="32" rx="6" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1" />
        <path d="M 12 11 L 20 19 M 20 11 L 12 19" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
        <text x="28" y="20" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="700">Coupon service timed out (504)</text>

        <!-- Step 2 Pin Circle -->
        <circle cx="-10" cy="16" r="10" fill="#ef4444" />
        <text x="-13" y="20" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800">2</text>
      </g>

      <!-- Step 3 Pin: Checkout Button Frozen in Click -->
      <g transform="translate(0, 126)">
        <rect x="0" y="0" width="280" height="40" rx="8" fill="#334155" stroke="#475569" stroke-width="1" />
        <text x="74" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Submit Order ($120)</text>

        <!-- Click Ripple Circle -->
        <circle cx="210" cy="20" r="18" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="1.5" />
        <circle cx="210" cy="20" r="8" fill="#ef4444" />

        <!-- Step 3 Pin Circle -->
        <circle cx="-10" cy="20" r="10" fill="#ef4444" />
        <text x="-13" y="24" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800">3</text>
      </g>

      <!-- Audio Narration Sound Wave Bar -->
      <g transform="translate(0, 186)">
        <rect x="0" y="0" width="412" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <!-- Mic Icon -->
        <circle cx="24" cy="24" r="12" fill="#89bd49" fill-opacity="0.2" />
        <path d="M 24 16 L 24 24 M 20 20 C 20 23, 28 23, 28 20" stroke="#89bd49" stroke-width="1.5" stroke-linecap="round" fill="none" />
        <!-- Audio Waves -->
        <g stroke="#89bd49" stroke-width="2" stroke-linecap="round">
          <line x1="48" y1="24" x2="48" y2="24" />
          <line x1="56" y1="20" x2="56" y2="28" />
          <line x1="64" y1="16" x2="64" y2="32" />
          <line x1="72" y1="12" x2="72" y2="36" />
          <line x1="80" y1="18" x2="80" y2="30" />
          <line x1="88" y1="15" x2="88" y2="33" />
          <line x1="96" y1="20" x2="96" y2="28" />
          <line x1="104" y1="22" x2="104" y2="26" />
        </g>
        <text x="120" y="28" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Voice Narration: &quot;Applying the summer coupon freezes checkout...&quot;</text>
      </g>
    </g>
  </g>

  <!-- Right: Auto-Captured Steps &amp; Telemetry Timeline -->
  <g transform="translate(520, 96)">
    <rect x="0" y="0" width="240" height="360" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <rect x="0" y="0" width="240" height="32" rx="10" fill="#1e293b" />
    <rect x="0" y="20" width="240" height="12" fill="#1e293b" />
    <text x="14" y="20" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="700">AUTO-DETECTED STEPS</text>

    <!-- Step List -->
    <g transform="translate(14, 44)">
      <!-- Step Item 1 -->
      <g transform="translate(0, 0)">
        <circle cx="8" cy="8" r="8" fill="#89bd49" />
        <text x="5" y="12" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="800">1</text>
        <text x="24" y="8" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Typed in input#coupon</text>
        <text x="24" y="22" fill="#64748b" font-family="monospace" font-size="9">00:04 · value=&quot;DISCOUNT...&quot;</text>
      </g>

      <!-- Step Item 2 -->
      <g transform="translate(0, 48)">
        <circle cx="8" cy="8" r="8" fill="#ef4444" />
        <text x="5" y="12" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="800">2</text>
        <text x="24" y="8" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">POST /api/promo/apply</text>
        <text x="24" y="22" fill="#f87171" font-family="monospace" font-size="9">00:12 · HTTP 504 Timeout</text>
      </g>

      <!-- Step Item 3 -->
      <g transform="translate(0, 96)">
        <circle cx="8" cy="8" r="8" fill="#ef4444" />
        <text x="5" y="12" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="800">3</text>
        <text x="24" y="8" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Click on disabled button</text>
        <text x="24" y="22" fill="#64748b" font-family="monospace" font-size="9">00:18 · button#btn-submit</text>
      </g>

      <!-- Telemetry Box inside QA pane -->
      <rect x="0" y="150" width="212" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="172" fill="#89bd49" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Root Cause Pinpoint</text>
      <text x="12" y="190" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Coupon service timeout drops</text>
      <text x="12" y="204" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">checkout promise without</text>
      <text x="12" y="218" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">resetting button loading state.</text>

      <rect x="12" y="234" width="188" height="26" rx="4" fill="#0f172a" />
      <path d="M 22 247 L 26 243 L 32 243 L 34 247 L 42 247 L 42 253 L 22 253 Z" fill="#38bdf8" />
      <text x="48" y="251" fill="#38bdf8" font-family="monospace" font-size="9">100% in your Google Drive</text>
    </g>
  </g>
</svg>
