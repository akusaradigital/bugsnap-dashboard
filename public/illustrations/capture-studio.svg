<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="cs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cs-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89bd49" />
      <stop offset="100%" stop-color="#6b9a35" />
    </linearGradient>
    <linearGradient id="cs-webcam-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="cs-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Canvas Frame -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="url(#cs-bg)" stroke="#334155" stroke-width="1.5" filter="url(#cs-shadow)" />

  <!-- Top Navigation Header (Matching Google Drive standard) -->
  <rect x="20" y="20" width="760" height="54" rx="16" fill="#1e293b" />
  <rect x="20" y="54" width="760" height="20" fill="#1e293b" />
  <line x1="20" y1="74" x2="780" y2="74" stroke="#334155" stroke-width="1" />

  <!-- Window Traffic Lights -->
  <g transform="translate(36, 42)">
    <circle cx="0" cy="0" r="4.5" fill="#ef4444" />
    <circle cx="14" cy="0" r="4.5" fill="#f59e0b" />
    <circle cx="28" cy="0" r="4.5" fill="#10b981" />
  </g>

  <!-- BugSnap Studio Breadcrumb Title with Screen Cam Logo -->
  <g transform="translate(84, 36)">
    <!-- Video Camera Icon -->
    <rect x="0" y="2" width="22" height="16" rx="3" fill="#89bd49" fill-opacity="0.2" stroke="#89bd49" stroke-width="1.5" />
    <polygon points="22,6 29,2 29,18 22,14" fill="#89bd49" />
    <circle cx="9" cy="10" r="3" fill="#89bd49" />

    <text x="36" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">BugSnap Studio</text>
    <text x="148" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">/</text>
    <text x="160" y="16" fill="#89bd49" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Active Tab Recorder</text>
  </g>

  <!-- URL Bar in center -->
  <g transform="translate(390, 34)">
    <rect x="0" y="0" width="230" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="12" r="3" fill="#10b981" />
    <text x="22" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">app.acme.corp/checkout</text>
  </g>

  <!-- Recording Status Badge on Top Right -->
  <g transform="translate(635, 34)">
    <rect x="0" y="0" width="115" height="24" rx="12" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.35)" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#ef4444" />
    <text x="26" y="16" fill="#f87171" font-family="monospace" font-size="11" font-weight="700">REC 00:14</text>
  </g>

  <!-- Target Web App Content Area -->
  <rect x="40" y="96" width="720" height="354" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />

  <!-- Mock Web App Header -->
  <rect x="64" y="118" width="140" height="18" rx="4" fill="#334155" />
  <rect x="64" y="142" width="220" height="10" rx="3" fill="#1e293b" />
  <rect x="640" y="120" width="90" height="28" rx="6" fill="#334155" />

  <!-- Mock Form Card -->
  <rect x="64" y="174" width="380" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="84" y="202" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Payment Information</text>

  <!-- Input fields -->
  <rect x="84" y="216" width="340" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="98" y="234" fill="#64748b" font-family="monospace" font-size="11">4242 •••• •••• 4242</text>

  <!-- Target Button with Area Selection &amp; Error Annotation -->
  <rect x="84" y="258" width="180" height="34" rx="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3" />
  <text x="114" y="280" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Pay $2,400.00</text>

  <!-- Floating Callout Error Badge -->
  <g transform="translate(280, 245)">
    <rect x="0" y="0" width="140" height="36" rx="6" fill="#ef4444" stroke="#ffffff" stroke-width="1" />
    <text x="10" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">HTTP 500 on click</text>
    <text x="10" y="28" fill="#fee2e2" font-family="monospace" font-size="9">TypeError in flow.ts:148</text>
    <!-- Pointer Arrow -->
    <polygon points="-8,18 0,12 0,24" fill="#ef4444" />
  </g>

  <!-- Privacy Blur Mask Overlay (Simulating automatic sensitive data hiding) -->
  <g transform="translate(64, 332)">
    <rect x="0" y="0" width="380" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <!-- Blur grid pattern -->
    <rect x="6" y="6" width="368" height="22" rx="4" fill="#1e293b" opacity="0.9" />
    <text x="18" y="21" fill="#64748b" font-family="monospace" font-size="10">client_secret_sk_live_99a8bc4490 (Auto-Blurred)</text>
    <!-- Lock badge -->
    <rect x="306" y="8" width="60" height="18" rx="3" fill="#89bd49" fill-opacity="0.2" />
    <text x="314" y="21" fill="#89bd49" font-family="system-ui, sans-serif" font-size="9" font-weight="700">REDACTED</text>
  </g>

  <!-- Floating Annotation Toolbar at Bottom Center -->
  <g transform="translate(200, 396)">
    <!-- Bar Container -->
    <rect x="0" y="0" width="400" height="46" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cs-shadow)" />

    <!-- Tool 1: Rectangle (Active) -->
    <rect x="8" y="7" width="32" height="32" rx="6" fill="#89bd49" fill-opacity="0.25" stroke="#89bd49" stroke-width="1.5" />
    <rect x="16" y="15" width="16" height="16" rx="2" fill="none" stroke="#89bd49" stroke-width="1.5" />

    <!-- Tool 2: Arrow -->
    <rect x="48" y="7" width="32" height="32" rx="6" fill="#1e293b" />
    <path d="M 58 29 L 70 17 M 70 17 L 64 17 M 70 17 L 70 23" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Tool 3: Text -->
    <rect x="88" y="7" width="32" height="32" rx="6" fill="#1e293b" />
    <text x="99" y="28" fill="#cbd5e1" font-family="serif" font-size="16" font-weight="700">T</text>

    <!-- Tool 4: Blur -->
    <rect x="128" y="7" width="32" height="32" rx="6" fill="#1e293b" />
    <rect x="136" y="15" width="16" height="16" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Tool 5: Number Step -->
    <rect x="168" y="7" width="32" height="32" rx="6" fill="#1e293b" />
    <circle cx="184" cy="23" r="8" fill="#3b82f6" />
    <text x="181" y="27" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">1</text>

    <!-- Separator -->
    <line x1="210" y1="11" x2="210" y2="35" stroke="#475569" stroke-width="1" />

    <!-- Color Dots -->
    <circle cx="230" cy="23" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="248" cy="23" r="5" fill="#f59e0b" />
    <circle cx="264" cy="23" r="5" fill="#89bd49" />
    <circle cx="280" cy="23" r="5" fill="#3b82f6" />

    <!-- Finish Button with clean vector checkmark -->
    <rect x="300" y="8" width="90" height="30" rx="6" fill="url(#cs-accent)" />
    <text x="318" y="27" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Done</text>
    <path d="M 354 23 L 358 27 L 366 19" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Webcam Picture-in-Picture Bubble with Mic Audio Waves -->
  <g transform="translate(635, 305)">
    <!-- Glow Ring -->
    <circle cx="50" cy="50" r="44" fill="url(#cs-webcam-bg)" stroke="#89bd49" stroke-width="2.5" filter="url(#cs-shadow)" />
    <!-- Avatar Head &amp; Shoulders -->
    <circle cx="50" cy="40" r="14" fill="#94a3b8" />
    <path d="M 28 72 C 28 58, 40 56, 50 56 C 60 56, 72 58, 72 72 Z" fill="#64748b" />
    <!-- Live Mic Audio Indicator Badge -->
    <rect x="25" y="78" width="50" height="16" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <!-- Sound Waves -->
    <line x1="38" y1="86" x2="38" y2="86" stroke="#89bd49" stroke-width="2" stroke-linecap="round" />
    <line x1="43" y1="84" x2="43" y2="88" stroke="#89bd49" stroke-width="2" stroke-linecap="round" />
    <line x1="48" y1="82" x2="48" y2="90" stroke="#89bd49" stroke-width="2" stroke-linecap="round" />
    <line x1="53" y1="84" x2="53" y2="88" stroke="#89bd49" stroke-width="2" stroke-linecap="round" />
    <line x1="58" y1="86" x2="58" y2="86" stroke="#89bd49" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
