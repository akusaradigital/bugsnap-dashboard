<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="dt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="dt-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89bd49" />
      <stop offset="100%" stop-color="#6b9a35" />
    </linearGradient>
    <filter id="dt-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="url(#dt-bg)" stroke="#334155" stroke-width="1.5" filter="url(#dt-shadow)" />

  <!-- Top Navigation Header (Matching Google Drive standard) -->
  <rect x="20" y="20" width="760" height="54" rx="16" fill="#1e293b" />
  <rect x="20" y="54" width="760" height="20" fill="#1e293b" />
  <line x1="20" y1="74" x2="780" y2="74" stroke="#334155" stroke-width="1" />

  <!-- Chrome DevTools Breadcrumb Title with Chrome Logo -->
  <g transform="translate(40, 36)">
    <!-- Chrome 4-color Logo -->
    <g transform="translate(0, 0) scale(1.15)">
      <path fill="#EA4335" d="M12 2a9.96 9.96 0 0 0-7.85 3.82l3.43 5.95A4.5 4.5 0 0 1 12 7.5h9.49A10 10 0 0 0 12 2z" />
      <path fill="#34A853" d="M4.15 5.82A10 10 0 0 0 2 12a10 10 0 0 0 6.64 9.42l3.43-5.95A4.5 4.5 0 0 1 7.5 12a4.52 4.52 0 0 1 .44-1.93L4.15 5.82z" />
      <path fill="#FBBC05" d="M21.49 7.5H12a4.5 4.5 0 0 1 3.9 6.75L12.47 20.2A10 10 0 0 0 22 12c0-1.58-.37-3.08-1.02-4.42l.51-.08z" />
      <circle cx="12" cy="12" r="4.5" fill="#FFFFFF" />
      <circle cx="12" cy="12" r="3.2" fill="#4285F4" />
    </g>
    <text x="36" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Chrome DevTools</text>
    <text x="162" y="20" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">/</text>
    <text x="174" y="20" fill="#89bd49" font-family="system-ui, sans-serif" font-size="14" font-weight="600">BugSnap Telemetry</text>
  </g>

  <!-- Auto-Attached Badge -->
  <g transform="translate(615, 38)">
    <rect x="0" y="0" width="135" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#10b981" />
    <text x="22" y="16" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Auto Diagnostics</text>
  </g>

  <!-- Tab Buttons Bar -->
  <g transform="translate(36, 84)">
    <!-- Active Tab: Console -->
    <rect x="0" y="0" width="94" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#ef4444" />
    <text x="24" y="16" fill="#f87171" font-family="monospace" font-size="11" font-weight="700">Console (1)</text>

    <!-- Network Tab -->
    <rect x="102" y="0" width="112" height="24" rx="6" fill="#1e293b" />
    <circle cx="116" cy="12" r="3.5" fill="#f59e0b" />
    <text x="126" y="16" fill="#94a3b8" font-family="monospace" font-size="11">Network (1 err)</text>

    <!-- Storage Tab -->
    <text x="232" y="16" fill="#64748b" font-family="monospace" font-size="11">Storage</text>
    <text x="302" y="16" fill="#64748b" font-family="monospace" font-size="11">System Info</text>
    <text x="396" y="16" fill="#64748b" font-family="monospace" font-size="11">DOM Replay</text>

    <!-- AI Clue Badge -->
    <rect x="584" y="2" width="136" height="20" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="594" y="16" fill="#89bd49" font-family="monospace" font-size="10" font-weight="600">AI Clue: Pinpointed</text>
  </g>

  <!-- Section 1: Console Error Row with Deep Stack Trace -->
  <g transform="translate(36, 120)">
    <rect x="0" y="0" width="728" height="88" rx="8" fill="rgba(239, 68, 68, 0.08)" stroke="rgba(239, 68, 68, 0.25)" stroke-width="1" />

    <!-- Error Icon -->
    <circle cx="20" cy="20" r="7" fill="#ef4444" />
    <path d="M 16 16 L 24 24 M 24 16 L 16 24" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

    <!-- Error Text -->
    <text x="36" y="21" fill="#fca5a5" font-family="monospace" font-size="12" font-weight="700">Uncaught TypeError: Cannot read properties of undefined (reading 'checkoutSessionId')</text>
    <text x="650" y="21" fill="#94a3b8" font-family="monospace" font-size="11">14:22:04</text>

    <!-- Stack Frames -->
    <text x="36" y="42" fill="#94a3b8" font-family="monospace" font-size="11">  at submitPayment (<tspan fill="#89bd49">src/checkout/flow.ts:148:19</tspan>)</text>
    <text x="36" y="60" fill="#64748b" font-family="monospace" font-size="11">  at handleCardSubmit (<tspan fill="#64748b">src/components/PaymentModal.tsx:84:12</tspan>)</text>
    <text x="36" y="78" fill="#64748b" font-family="monospace" font-size="11">  at HTMLButtonElement.dispatch (<tspan fill="#64748b">node_modules/react-dom/client.js:4:8120</tspan>)</text>
  </g>

  <!-- Section 2: Network Waterfall Telemetry Table -->
  <g transform="translate(36, 220)">
    <rect x="0" y="0" width="728" height="136" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />

    <!-- Table Header -->
    <rect x="0" y="0" width="728" height="26" rx="8" fill="#1e293b" />
    <rect x="0" y="14" width="728" height="12" fill="#1e293b" />
    <text x="16" y="17" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="700">STATUS</text>
    <text x="76" y="17" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="700">METHOD</text>
    <text x="140" y="17" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="700">URL / ENDPOINT</text>
    <text x="440" y="17" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="700">DURATION</text>
    <text x="540" y="17" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="700">WATERFALL</text>

    <!-- Row 1: Failed Request (500) -->
    <rect x="0" y="26" width="728" height="34" fill="rgba(239, 68, 68, 0.05)" stroke="#1e293b" stroke-width="0.5" />
    <rect x="14" y="33" width="36" height="20" rx="4" fill="#ef4444" fill-opacity="0.2" />
    <text x="21" y="47" fill="#f87171" font-family="monospace" font-size="11" font-weight="700">500</text>
    <text x="76" y="47" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="700">POST</text>
    <text x="140" y="47" fill="#cbd5e1" font-family="monospace" font-size="11">/api/v1/checkout/charge-token</text>
    <text x="440" y="47" fill="#f87171" font-family="monospace" font-size="11">842 ms</text>
    <!-- Waterfall Bar -->
    <rect x="540" y="39" width="140" height="8" rx="4" fill="#ef4444" />

    <!-- Row 2: Successful Request (200) -->
    <rect x="0" y="60" width="728" height="34" fill="#0f172a" stroke="#1e293b" stroke-width="0.5" />
    <rect x="14" y="67" width="36" height="20" rx="4" fill="#10b981" fill-opacity="0.2" />
    <text x="21" y="81" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">200</text>
    <text x="76" y="81" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">GET</text>
    <text x="140" y="81" fill="#94a3b8" font-family="monospace" font-size="11">/api/v1/users/me/subscription</text>
    <text x="440" y="81" fill="#94a3b8" font-family="monospace" font-size="11">64 ms</text>
    <!-- Waterfall Bar -->
    <rect x="540" y="73" width="30" height="8" rx="4" fill="#10b981" />

    <!-- Row 3: Preflight Options Request (204) -->
    <rect x="0" y="94" width="728" height="34" fill="#0f172a" />
    <rect x="14" y="101" width="36" height="20" rx="4" fill="#3b82f6" fill-opacity="0.2" />
    <text x="21" y="115" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="700">204</text>
    <text x="76" y="115" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">OPTIONS</text>
    <text x="140" y="115" fill="#64748b" font-family="monospace" font-size="11">/api/v1/checkout/charge-token</text>
    <text x="440" y="115" fill="#64748b" font-family="monospace" font-size="11">22 ms</text>
    <!-- Waterfall Bar -->
    <rect x="540" y="107" width="16" height="8" rx="4" fill="#3b82f6" />
  </g>

  <!-- Section 3: Bottom System Specs & Action Bar -->
  <g transform="translate(36, 368)">
    <rect x="0" y="0" width="728" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />

    <!-- Spec Badge 1 -->
    <g transform="translate(16, 14)">
      <text x="0" y="12" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">BROWSER &amp; OS</text>
      <text x="0" y="30" fill="#cbd5e1" font-family="monospace" font-size="11" font-weight="600">Chrome 129.0 · macOS 15.1</text>
    </g>

    <!-- Spec Badge 2 -->
    <g transform="translate(200, 14)">
      <text x="0" y="12" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">VIEWPORT &amp; DPR</text>
      <text x="0" y="30" fill="#cbd5e1" font-family="monospace" font-size="11" font-weight="600">1920×1080 (2.0x Retina)</text>
    </g>

    <!-- Spec Badge 3 -->
    <g transform="translate(390, 14)">
      <text x="0" y="12" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">DATA DESTINATION</text>
      <text x="0" y="30" fill="#89bd49" font-family="monospace" font-size="11" font-weight="600">Google Drive (AES-256)</text>
    </g>

    <!-- Copy cURL / Markdown Actions -->
    <rect x="570" y="21" width="142" height="32" rx="6" fill="url(#dt-accent)" />
    <text x="590" y="41" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Copy Jira/Linear ↗</text>
  </g>
</svg>
