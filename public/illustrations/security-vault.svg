<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="sec-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sec-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sec-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89bd49" />
      <stop offset="100%" stop-color="#6b9a35" />
    </linearGradient>
    <filter id="sec-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="url(#sec-bg)" stroke="#334155" stroke-width="1.5" filter="url(#sec-shadow)" />

  <!-- Top Header (Matching Google Drive standard) -->
  <rect x="20" y="20" width="760" height="54" rx="16" fill="#1e293b" />
  <rect x="20" y="54" width="760" height="20" fill="#1e293b" />
  <line x1="20" y1="74" x2="780" y2="74" stroke="#334155" stroke-width="1" />

  <!-- Title Badge with Shield Icon -->
  <g transform="translate(40, 36)">
    <g transform="translate(0, 0)">
      <path d="M 12 2 L 24 2 C 24 14, 18 24, 12 28 C 6 24, 0 14, 0 2 Z" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
      <path d="M 7 13 L 10 16 L 17 9" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="36" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Security Vault</text>
    <text x="142" y="20" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">/</text>
    <text x="154" y="20" fill="#89bd49" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Zero Server Data Retention</text>
  </g>

  <!-- Compliance Tags Badge -->
  <g transform="translate(590, 38)">
    <rect x="0" y="0" width="160" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#10b981" />
    <text x="22" y="16" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SOC 2 &amp; GDPR Verified</text>
  </g>

  <!-- Visual Architecture: 3 Stage Secure Pipeline -->
  <g transform="translate(40, 100)">
    <!-- Stage 1: Client-Side Capture & Sanitization -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="340" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <rect x="0" y="0" width="220" height="36" rx="12" fill="#1e293b" />
      <rect x="0" y="20" width="220" height="16" fill="#1e293b" />
      <text x="16" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STAGE 1: YOUR BROWSER</text>

      <!-- Sub elements -->
      <g transform="translate(16, 50)">
        <rect x="0" y="0" width="188" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="12" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">In-Memory Redaction</text>
        <text x="12" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Regex masks applied</text>
        <text x="12" y="56" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">before payload leaves tab.</text>

        <!-- Redacted pill badge -->
        <rect x="12" y="86" width="188" height="24" rx="4" fill="#0f172a" />
        <circle cx="22" cy="98" r="4" fill="#89bd49" />
        <text x="32" y="102" fill="#89bd49" font-family="monospace" font-size="9">Passwords &amp; tokens masked</text>
      </g>

      <g transform="translate(16, 180)">
        <text x="0" y="16" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Network Log Filter</text>
        <text x="0" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" leading="15">Authorization bearer</text>
        <text x="0" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">headers &amp; cookies are stripped</text>
        <text x="0" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">automatically on client side.</text>

        <rect x="0" y="78" width="188" height="26" rx="6" fill="#1e293b" />
        <text x="10" y="95" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="600">Client-Side Redaction Active</text>
      </g>
    </g>

    <!-- Connector Arrow 1 to 2 -->
    <g transform="translate(225, 160)">
      <line x1="0" y1="10" x2="20" y2="10" stroke="#89bd49" stroke-width="2" stroke-dasharray="3 3" />
      <polygon points="20,6 27,10 20,14" fill="#89bd49" />
      <text x="0" y="28" fill="#64748b" font-family="monospace" font-size="8">Secure RPC</text>
    </g>

    <!-- Stage 2: BugSnap Zero-Liability Proxy -->
    <g transform="translate(255, 0)">
      <rect x="0" y="0" width="210" height="340" rx="12" fill="#0f172a" stroke="#89bd49" stroke-width="1.5" />
      <rect x="0" y="0" width="210" height="36" rx="12" fill="#1e293b" />
      <rect x="0" y="20" width="210" height="16" fill="#1e293b" />
      <text x="16" y="24" fill="#89bd49" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STAGE 2: BUGSNAAP EDGE</text>

      <!-- BugSnap Logo &amp; Zero Data Badge -->
      <g transform="translate(16, 50)">
        <rect x="0" y="0" width="178" height="106" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="28" cy="28" r="14" fill="#89bd49" fill-opacity="0.2" />
        <circle cx="28" cy="28" r="6" fill="#89bd49" />
        <text x="50" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Zero Storage</text>

        <!-- Zero byte counter -->
        <rect x="12" y="56" width="154" height="36" rx="6" fill="#0f172a" />
        <text x="24" y="74" fill="#64748b" font-family="monospace" font-size="9">HELD ON SERVER:</text>
        <text x="24" y="88" fill="#89bd49" font-family="monospace" font-size="12" font-weight="700">0 KB (Ephemeral)</text>
      </g>

      <g transform="translate(16, 172)">
        <text x="0" y="16" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">No Video/Audio Relays</text>
        <text x="0" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" leading="15">Recordings stream straight</text>
        <text x="0" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">from browser into your Google</text>
        <text x="0" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Drive storage chunk-by-chunk.</text>

        <rect x="0" y="82" width="178" height="26" rx="6" fill="#1e293b" />
        <text x="10" y="99" fill="#89bd49" font-family="monospace" font-size="9" font-weight="600">No Third-Party Leaks</text>
      </g>
    </g>

    <!-- Connector Arrow 2 to 3 -->
    <g transform="translate(470, 160)">
      <line x1="0" y1="10" x2="25" y2="10" stroke="#89bd49" stroke-width="2" stroke-dasharray="3 3" />
      <polygon points="25,6 32,10 25,14" fill="#89bd49" />
      <text x="0" y="28" fill="#64748b" font-family="monospace" font-size="8">OAuth 2.0</text>
    </g>

    <!-- Stage 3: Customer's Private Google Drive -->
    <g transform="translate(505, 0)">
      <rect x="0" y="0" width="215" height="340" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <rect x="0" y="0" width="215" height="36" rx="12" fill="#1e293b" />
      <rect x="0" y="20" width="215" height="16" fill="#1e293b" />
      <text x="16" y="24" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STAGE 3: YOUR DRIVE</text>

      <!-- Google Drive Folder Visual -->
      <g transform="translate(16, 50)">
        <rect x="0" y="0" width="183" height="96" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" />
        <!-- Drive Logo Small -->
        <g transform="translate(16, 18)">
          <path d="M 8 18 L 15 6 L 22 18 Z" fill="#4285F4" />
          <path d="M 15 6 L 22 18 L 32 18 L 25 6 Z" fill="#FBBC05" />
          <path d="M 8 18 L 1 18 L 8 6 L 15 6 Z" fill="#34A853" />
        </g>
        <text x="56" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Company Drive</text>
        <text x="56" y="46" fill="#34d399" font-family="monospace" font-size="9">AES-256 Encrypted</text>

        <rect x="12" y="60" width="159" height="24" rx="4" fill="#0f172a" />
        <path d="M 20 73 L 24 69 L 30 69 L 32 73 L 40 73 L 40 79 L 20 79 Z" fill="#89bd49" />
        <text x="46" y="76" fill="#cbd5e1" font-family="monospace" font-size="9">/BugSnap/2026-10/</text>
      </g>

      <g transform="translate(16, 160)">
        <text x="0" y="16" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Total Data Sovereignty</text>
        <text x="0" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Encrypted at rest with your</text>
        <text x="0" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">enterprise Google keys.</text>
        <text x="0" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Delete or revoke access</text>
        <text x="0" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">anytime directly from Google.</text>

        <rect x="0" y="90" width="183" height="26" rx="6" fill="#1e293b" />
        <path d="M 14 104 L 17 107 L 24 99" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="30" y="107" fill="#34d399" font-family="monospace" font-size="9" font-weight="600">Your Keys · Your Storage</text>
      </g>
    </g>
  </g>
</svg>
