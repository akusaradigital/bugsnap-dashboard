<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="gd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gd-drive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="gd-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89bd49" />
      <stop offset="100%" stop-color="#6b9a35" />
    </linearGradient>
    <filter id="gd-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="url(#gd-bg)" stroke="#334155" stroke-width="1.5" filter="url(#gd-shadow)" />

  <!-- Top Navigation Header -->
  <rect x="20" y="20" width="760" height="54" rx="16" fill="#1e293b" />
  <rect x="20" y="54" width="760" height="20" fill="#1e293b" />
  <line x1="20" y1="74" x2="780" y2="74" stroke="#334155" stroke-width="1" />

  <!-- Google Drive Breadcrumb Title -->
  <g transform="translate(40, 36)">
    <!-- Google Drive Triangle Logo -->
    <path d="M 12 28 L 22 10 L 32 28 Z" fill="#4285F4" opacity="0.9" />
    <path d="M 22 10 L 32 28 L 46 28 L 36 10 Z" fill="#FBBC05" opacity="0.9" />
    <path d="M 12 28 L 2 28 L 12 10 L 22 10 Z" fill="#34A853" opacity="0.9" />
    <text x="56" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Google Drive</text>
    <text x="144" y="22" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">/</text>
    <text x="156" y="22" fill="#89bd49" font-family="system-ui, sans-serif" font-size="14" font-weight="600">BugSnap Captures</text>
  </g>

  <!-- 100% Owned Badge -->
  <g transform="translate(620, 38)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#10b981" />
    <text x="22" y="16" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">100% Data Owner</text>
  </g>

  <!-- Left Sidebar: Folder Directory Tree -->
  <g transform="translate(40, 96)">
    <rect x="0" y="0" width="220" height="360" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="26" fill="#64748b" font-family="monospace" font-size="10" font-weight="700">FOLDERS &amp; WORKSPACES</text>

    <!-- Folder 1: Active -->
    <rect x="8" y="38" width="204" height="34" rx="6" fill="#1e293b" />
    <path d="M 22 55 L 26 50 L 36 50 L 39 55 L 50 55 L 50 64 L 22 64 Z" fill="#89bd49" opacity="0.8" />
    <text x="58" y="59" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">BugSnap (Root)</text>

    <!-- Folder 2: Sub-folder -->
    <path d="M 32 89 L 35 85 L 43 85 L 45 89 L 54 89 L 54 96 L 32 96 Z" fill="#94a3b8" />
    <text x="62" y="94" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Sprint-42-Checkout</text>

    <!-- Folder 3: Sub-folder -->
    <path d="M 32 121 L 35 117 L 43 117 L 45 121 L 54 121 L 54 128 L 32 128 Z" fill="#94a3b8" />
    <text x="62" y="126" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">QA-Regression</text>

    <!-- Folder 4: Sub-folder -->
    <path d="M 32 153 L 35 149 L 43 149 L 45 153 L 54 153 L 54 160 L 32 160 Z" fill="#94a3b8" />
    <text x="62" y="158" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Staging-Feedback</text>

    <!-- Privacy Callout Box in Sidebar -->
    <rect x="12" y="240" width="196" height="106" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="24" y="262" fill="#89bd49" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Zero Server Storage</text>
    <text x="24" y="280" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" leading="14">BugSnap backend never</text>
    <text x="24" y="294" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">saves your files. You own</text>
    <text x="24" y="308" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">storage &amp; retention rules.</text>
    <circle cx="28" cy="330" r="3" fill="#10b981" />
    <text x="36" y="333" fill="#34d399" font-family="monospace" font-size="9" font-weight="600">SOC 2 / GDPR Compliant</text>
  </g>

  <!-- Right Main View: Drive Files & Instant Share Link -->
  <g transform="translate(280, 96)">
    <rect x="0" y="0" width="480" height="360" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />

    <!-- Table Header -->
    <rect x="0" y="0" width="480" height="32" rx="10" fill="#1e293b" />
    <rect x="0" y="20" width="480" height="12" fill="#1e293b" />
    <text x="16" y="20" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="700">FILE NAME</text>
    <text x="280" y="20" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="700">MODIFIED</text>
    <text x="390" y="20" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="700">SIZE</text>

    <!-- File Row 1: Video Capture WebM -->
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="480" height="52" fill="#0f172a" stroke="#1e293b" stroke-width="0.5" />
      <!-- Video Icon -->
      <rect x="16" y="14" width="24" height="24" rx="4" fill="#ef4444" fill-opacity="0.15" />
      <polygon points="25,21 33,26 25,31" fill="#ef4444" />
      <!-- File details -->
      <text x="48" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">checkout-error-http500.webm</text>
      <text x="48" y="42" fill="#64748b" font-family="monospace" font-size="10">HD 1080p · 60fps · Audio Narration</text>
      <text x="280" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Just now</text>
      <text x="390" y="32" fill="#cbd5e1" font-family="monospace" font-size="11">12.4 MB</text>
    </g>

    <!-- File Row 2: DevTools Logs JSON -->
    <g transform="translate(0, 84)">
      <rect x="0" y="0" width="480" height="52" fill="#0f172a" stroke="#1e293b" stroke-width="0.5" />
      <!-- JSON Icon -->
      <rect x="16" y="14" width="24" height="24" rx="4" fill="#3b82f6" fill-opacity="0.15" />
      <text x="22" y="30" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="700">{ }</text>
      <!-- File details -->
      <text x="48" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">devtools-telemetry.json</text>
      <text x="48" y="42" fill="#64748b" font-family="monospace" font-size="10">Console exceptions · Network 4xx/5xx · Specs</text>
      <text x="280" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Just now</text>
      <text x="390" y="32" fill="#cbd5e1" font-family="monospace" font-size="11">48 KB</text>
    </g>

    <!-- File Row 3: Annotated Screenshot PNG -->
    <g transform="translate(0, 136)">
      <rect x="0" y="0" width="480" height="52" fill="#0f172a" stroke="#1e293b" stroke-width="0.5" />
      <!-- PNG Icon -->
      <rect x="16" y="14" width="24" height="24" rx="4" fill="#89bd49" fill-opacity="0.15" />
      <rect x="22" y="20" width="12" height="12" rx="2" stroke="#89bd49" stroke-width="1.5" fill="none" />
      <!-- File details -->
      <text x="48" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">annotated-checkout-error.png</text>
      <text x="48" y="42" fill="#64748b" font-family="monospace" font-size="10">Arrow Callout · Blur Mask Applied</text>
      <text x="280" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">2 mins ago</text>
      <text x="390" y="32" fill="#cbd5e1" font-family="monospace" font-size="11">1.8 MB</text>
    </g>

    <!-- Bottom Interactive Share Bar -->
    <g transform="translate(16, 210)">
      <rect x="0" y="0" width="448" height="136" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Interactive Web Viewer Link</text>
      <text x="16" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Teammates can view video and inspect logs without login or installation.</text>

      <!-- Link URL Input box -->
      <rect x="16" y="56" width="300" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="28" y="76" fill="#94a3b8" font-family="monospace" font-size="11">https://bugsnap.akusara.../v/8cd0c35b</text>

      <!-- Copy Button -->
      <rect x="326" y="56" width="106" height="32" rx="6" fill="url(#gd-accent)" />
      <text x="342" y="76" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Copy Link</text>

      <!-- Jira/Linear/Slack quick icons -->
      <g transform="translate(16, 102)">
        <text x="0" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Ready to paste into:</text>
        <rect x="110" y="4" width="48" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="118" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" font-weight="600">JIRA</text>
        <rect x="164" y="4" width="56" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="172" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" font-weight="600">LINEAR</text>
        <rect x="226" y="4" width="56" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="234" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" font-weight="600">GITHUB</text>
        <rect x="288" y="4" width="50" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="296" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" font-weight="600">SLACK</text>
      </g>
    </g>
  </g>
</svg>
