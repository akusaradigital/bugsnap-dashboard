<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DCE8FF"/>
      <stop offset="100%" stop-color="#DCE8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F6FF"/>
    </linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D5BD8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Soft backdrop -->
  <ellipse cx="280" cy="210" rx="260" ry="200" fill="url(#glow)"/>

  <!-- Browser window, tilted slightly for depth -->
  <g transform="translate(280 215) rotate(-4) translate(-230 -150)" filter="url(#soft)">
    <rect x="0" y="0" width="460" height="300" rx="20" fill="url(#win)" stroke="#D6E2F5" stroke-width="2"/>
    <rect x="0" y="0" width="460" height="46" rx="20" fill="#EEF4FD"/>
    <rect x="0" y="30" width="460" height="16" fill="#EEF4FD"/>
    <circle cx="24" cy="23" r="6" fill="#FB7185"/>
    <circle cx="44" cy="23" r="6" fill="#FBBF24"/>
    <circle cx="64" cy="23" r="6" fill="#34D399"/>
    <rect x="96" y="13" width="300" height="20" rx="10" fill="#FFFFFF" stroke="#DCE6F5"/>
    <!-- Canvas area -->
    <rect x="28" y="70" width="404" height="206" rx="14" fill="#F7FAFF" stroke="#E3EBF7"/>
    <!-- Camera -->
    <g transform="translate(230 170)">
      <rect x="-82" y="-58" width="164" height="116" rx="22" fill="url(#cam)"/>
      <rect x="-40" y="-72" width="52" height="22" rx="7" fill="#1D4ED8"/>
      <circle cx="0" cy="0" r="36" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="22" fill="#3B82F6"/>
      <circle cx="-8" cy="-8" r="6" fill="#BFDBFE"/>
      <circle cx="56" cy="-36" r="5" fill="#FFFFFF" opacity="0.85"/>
    </g>
    <!-- Text lines in the mock page -->
    <rect x="48" y="250" width="120" height="8" rx="4" fill="#C9D8F0"/>
    <rect x="48" y="266" width="200" height="8" rx="4" fill="#DCE6F5"/>
  </g>

  <!-- Capture flash marks -->
  <g stroke="#3B82F6" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M42 96 L58 78"/>
    <path d="M36 122 L18 118"/>
    <path d="M56 70 L62 52"/>
  </g>

  <!-- Cursor -->
  <g transform="translate(398 300)" filter="url(#soft)">
    <path d="M0 0 L0 34 L9 26 L16 42 L24 38 L17 23 L30 23 Z" fill="#0F172A" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
