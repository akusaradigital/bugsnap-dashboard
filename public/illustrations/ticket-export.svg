<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="te-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="te-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89bd49" />
      <stop offset="100%" stop-color="#6b9a35" />
    </linearGradient>
    <filter id="te-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="url(#te-bg)" stroke="#334155" stroke-width="1.5" filter="url(#te-shadow)" />

  <!-- Top Header (Matching Google Drive standard) -->
  <rect x="20" y="20" width="760" height="54" rx="16" fill="#1e293b" />
  <rect x="20" y="54" width="760" height="20" fill="#1e293b" />
  <line x1="20" y1="74" x2="780" y2="74" stroke="#334155" stroke-width="1" />

  <!-- Title Badge with Check Box Icon -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="28" height="28" rx="6" fill="#89bd49" fill-opacity="0.2" stroke="#89bd49" stroke-width="1" />
    <path d="M 8 14 L 13 19 L 20 10" stroke="#89bd49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="38" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Issue Formatter</text>
    <text x="156" y="20" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">/</text>
    <text x="168" y="20" fill="#89bd49" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Markdown Ticket Generator</text>
  </g>

  <!-- Export Destination Selector Tabs on Top Right -->
  <g transform="translate(490, 34)">
    <rect x="0" y="0" width="250" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <!-- Linear (Active) -->
    <rect x="3" y="3" width="58" height="22" rx="4" fill="#89bd49" />
    <text x="14" y="18" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">LINEAR</text>
    <!-- Jira -->
    <text x="76" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">JIRA</text>
    <!-- GitHub -->
    <text x="124" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">GITHUB</text>
    <!-- Slack -->
    <text x="188" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SLACK</text>
  </g>

  <!-- Left: Formatted Markdown Editor Preview -->
  <g transform="translate(40, 96)">
    <rect x="0" y="0" width="460" height="360" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />

    <!-- Code Editor Header -->
    <rect x="0" y="0" width="460" height="32" rx="10" fill="#1e293b" />
    <rect x="0" y="20" width="460" height="12" fill="#1e293b" />
    <text x="16" y="20" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="700">bug-report-template.md</text>
    <rect x="370" y="6" width="76" height="20" rx="4" fill="#0f172a" />
    <text x="382" y="19" fill="#89bd49" font-family="monospace" font-size="9" font-weight="600">Markdown</text>

    <!-- Markdown Content Lines -->
    <g transform="translate(16, 44)" font-family="monospace" font-size="11">
      <text x="0" y="16" fill="#89bd49" font-weight="700">## [Bug] HTTP 500 on Checkout Submission</text>
      <text x="0" y="40" fill="#cbd5e1"><tspan fill="#64748b">**Severity:**</tspan> High (P1) · <tspan fill="#64748b">**Environment:**</tspan> Production</text>

      <text x="0" y="70" fill="#38bdf8" font-weight="700">### Steps to Reproduce:</text>
      <text x="0" y="90" fill="#94a3b8">1. Navigate to <tspan fill="#cbd5e1">app.acme.corp/checkout/billing</tspan></text>
      <text x="0" y="108" fill="#94a3b8">2. Fill valid credit card test credentials</text>
      <text x="0" y="126" fill="#94a3b8">3. Click <tspan fill="#f87171">[Pay $2,400.00]</tspan> button</text>
      <text x="0" y="144" fill="#f87171">&gt; Error: Uncaught TypeError: checkoutSessionId is undefined</text>

      <text x="0" y="174" fill="#38bdf8" font-weight="700">### Telemetry &amp; DevLogs:</text>
      <text x="0" y="194" fill="#94a3b8">- <tspan fill="#cbd5e1">Console:</tspan> 1 Unhandled Exception at <tspan fill="#89bd49">flow.ts:148</tspan></text>
      <text x="0" y="210" fill="#94a3b8">- <tspan fill="#cbd5e1">Network:</tspan> POST /api/v1/charge-token (<tspan fill="#f87171">500 Server Error</tspan>)</text>
      <text x="0" y="226" fill="#94a3b8">- <tspan fill="#cbd5e1">Specs:</tspan> Chrome 129.0 / macOS Sequoia 15.1 (DPR 2.0)</text>

      <text x="0" y="256" fill="#38bdf8" font-weight="700">### Attached Artifacts:</text>
      <!-- Link icon vector -->
      <g transform="translate(0, 268)">
        <path d="M 4 8 C 4 6, 6 4, 8 4 L 12 4 M 14 8 C 14 10, 12 12, 10 12 L 6 12 M 6 8 L 12 8" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" fill="none" />
      </g>
      <text x="20" y="276" fill="#38bdf8">Interactive Video &amp; Telemetry Player (No login needed)</text>
      <text x="20" y="292" fill="#64748b">https://bugsnap.akusara.../v/8cd0c35b-8683</text>
    </g>
  </g>

  <!-- Right: Target Ticket Destination Mockup &amp; Copy Action -->
  <g transform="translate(520, 96)">
    <!-- Simulated Linear / Jira Issue Card -->
    <rect x="0" y="0" width="240" height="240" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <rect x="0" y="0" width="240" height="36" rx="10" fill="#1e293b" />
    <rect x="0" y="20" width="240" height="16" fill="#1e293b" />
    <text x="14" y="22" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ENG-4829 · Bug Report</text>
    <rect x="184" y="8" width="44" height="20" rx="4" fill="#ef4444" fill-opacity="0.2" />
    <text x="192" y="22" fill="#f87171" font-family="monospace" font-size="9" font-weight="700">BUG</text>

    <g transform="translate(14, 46)">
      <text x="0" y="14" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Checkout HTTP 500</text>
      <rect x="0" y="24" width="212" height="1" fill="#1e293b" />

      <!-- Linear Assignee &amp; Priority -->
      <text x="0" y="44" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Assignee: @alex</text>
      <text x="0" y="60" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Priority: Urgent (P1)</text>

      <!-- Video thumbnail card inside ticket -->
      <rect x="0" y="74" width="212" height="74" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <polygon points="100,102 114,111 100,120" fill="#89bd49" />
      <text x="44" y="136" fill="#cbd5e1" font-family="monospace" font-size="9">Watch 14s Recording</text>
    </g>

    <!-- Copy Action Card -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="240" height="96" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="700">One-Click Clipboard</text>
      <text x="14" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Ready to paste directly into</text>
      <text x="14" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">your team issue tracker.</text>

      <!-- Action Button -->
      <rect x="14" y="62" width="212" height="26" rx="6" fill="url(#te-accent)" />
      <text x="74" y="79" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Copy Markdown ↗</text>
    </g>
  </g>
</svg>
